<div class="ph"><div><h1>售后单</h1><p>本周 <b>148</b> 单，<b>23</b> 单待处理，其中 <b>6</b> 单已超过 48 小时承诺时效。</p></div><div class="r"><button class="btn btn-g">导出</button><button class="btn btn-s">新建售后</button></div></div>
<div class="flt"><span class="chip on">待处理 <b>23</b></span><span class="chip">处理中 <b>41</b></span><span class="chip">已完成 <b>84</b></span><span class="sp"></span><span class="chip">门店：全部 ▾</span><span class="chip">类型：退款 / 换货 ▾</span><span class="chip">10-11 ~ 10-17 ▾</span></div>
<table class="tb"><thead><tr><th><span class="cb" id="all"></span></th><th>售后单</th><th>状态</th><th>客户 · 门店</th><th>原因</th><th>已等待</th><th class="n">金额</th></tr></thead><tbody id="rows"></tbody></table>
<p class="muted" style="margin-top:12px;font-size:12px">共 23 单 · 已按等待时间倒序 · 勾选后底部出现批量操作</p>
</div>
<div class="act sel-bar" id="sb"><div class="cons"><span><b id="sn">0</b>&nbsp;单已选 · 合计&nbsp;<b id="sa">¥0</b></span><span><i></i>10 分钟内可撤销</span><span><i class="w"></i>退款将原路退回，1–3 天到账</span></div><div class="r"><button class="btn btn-g" onclick="clr()">取消选择</button><button class="btn btn-p" id="go">批准退款</button></div></div></div>
</div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button onclick="window.undo&&undo()">撤销 <span class="k" style="border-color:rgba(255,255,255,.25);color:#ccc">Z</span></button></div>
<script>
function G(k,c){return '<svg class="g '+(c||k)+'"><use href="#g-'+k+'"/></svg>';}
function money(n,d){return '<span class="amt"><s>¥</s>'+Math.floor(n).toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>';}
var _tt;function toast(m){document.getElementById('tmsg').textContent=m;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){T.classList.remove('show');},5000);}

var D=[['SH2410170931','late','超时 3 天','刘佳琪','苏州 · 观前店','香薰礼盒破损',72,238],['SH2410170926','late','超时 2 天','王梓涵','上海 · 徐汇店','耳机左耳无声',55,799],['SH2410170918','late','超时 1 天','赵一鸣','南京 · 新街口店','发错颜色',30,356],
['SH2410170902','prog','门店核实中','陈思远','杭州 · 湖滨店','拉链损坏',20,699],['SH2410170877','todo','待处理','吴俊杰','苏州 · 观前店','重复扣款',14,1490],['SH2410170861','todo','待处理','郑可欣','上海 · 徐汇店','未收到货',9,636],
['SH2410170850','todo','待处理','孙婉清','北京 · 朝阳门店','尺码不合适',6,329],['SH2410170843','prog','等客户寄回','何嘉怡','北京 · 望京店','质量问题',5,1180],['SH2410170839','todo','待处理','马文博','成都 · 春熙路店','少发配件',4,89],
['SH2410170821','todo','待处理','黄子轩','广州 · 天河店','七天无理由',3,459],['SH2410170817','done','已退款','周若彤','深圳 · 南山店','商品破损',2,268],['SH2410170802','todo','待处理','林晓雯','上海 · 静安店','包装破损',1,129]];
var sel={};function r(){document.getElementById('rows').innerHTML=D.map(function(d,i){return '<tr class="'+(sel[i]?'sel':'')+'" data-i="'+i+'"><td><span class="cb'+(sel[i]?' on':'')+'"></span></td><td class="mono">'+d[0]+'</td><td><span class="st2 '+(d[1]=='late'?'late':'')+'">'+G(d[1])+d[2]+'</span></td><td>'+d[3]+' <span class="muted">'+d[4]+'</span></td><td style="color:var(--color-text-secondary)">'+d[5]+'</td><td><span class="age'+(d[6]<48?' ok':'')+'"><i><b style="width:'+Math.min(100,d[6])+'%"></b></i>'+(d[6]>=24?Math.floor(d[6]/24)+' 天':d[6]+' 小时')+'</span></td><td class="n">'+money(d[7])+'</td></tr>';}).join('');
document.querySelectorAll('#rows tr').forEach(function(t){t.onclick=function(){var i=+t.dataset.i;if(sel[i])delete sel[i];else sel[i]=1;r();};});
var k=Object.keys(sel),sum=k.reduce(function(a,i){return a+D[i][7];},0);document.getElementById('sb').classList.toggle('show',k.length>0);document.getElementById('sn').textContent=k.length;document.getElementById('sa').textContent='¥'+sum.toLocaleString();
document.getElementById('go').textContent='批准退款 '+k.length+' 单 · ¥'+sum.toLocaleString();document.getElementById('all').className='cb'+(k.length===D.length?' on':'');}
function clr(){sel={};r();}document.getElementById('all').onclick=function(){if(Object.keys(sel).length===D.length)sel={};else D.forEach(function(_,i){sel[i]=1;});r();};
var last=null;document.getElementById('go').onclick=function(){last=JSON.parse(JSON.stringify(D));var n=Object.keys(sel).length;Object.keys(sel).forEach(function(i){D[i][1]='done';D[i][2]='已批准';});toast('已批准 '+n+' 单退款，10 分钟内可撤销');sel={};r();};
function undo(){if(last){D=last;last=null;r();document.getElementById('toast').classList.remove('show');}}
[0,1,2].forEach(function(i){sel[i]=1;});r();
</script>
