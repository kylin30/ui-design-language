.hits{list-style:none;margin-top:8px}.hits li{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--color-divider);font-size:12.5px}.hits li span{margin-left:auto;color:var(--color-text-tertiary)}

<script>
function G(k,c){return '<svg class="g '+(c||k)+'"><use href="#g-'+k+'"/></svg>';}
function money(n,d){return '<span class="amt"><s>¥</s>'+Math.floor(n).toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>';}
var _tt;function toast(m){document.getElementById('tmsg').textContent=m;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){T.classList.remove('show');},5000);}

var Q=[{g:'late',grp:'疑似违规',t:'「秋冬礼盒低价转让」',m:'晓风 · 笔记 · 机审 0.91 广告引流',w:'举报 6',late:1,au:'晓风',lv:'Lv2 · 注册 9 天',
 txt:'全新香薰礼盒，公司发的用不上，原价 ¥399 现 ¥99 包邮。<mark>加微 xf_9981 发图</mark>，<mark>私聊更便宜</mark>，量大可批发。',img:[0,1,0],h:'疑似站外引流：正文含微信号和“私聊更便宜”，第 2 张图有二维码',hits:[['广告引流 · 站外联系方式','规则 3.2'],['图片二维码','规则 3.4'],['近 7 天同类发布 5 次','账号行为']],btn:'驳回并限流 7 天'},
 {g:'late',grp:'疑似违规',t:'「这家店客服态度太差」',m:'林小满 · 评价 · 举报 3',w:'举报 3',late:1,au:'林小满',lv:'Lv5 · 注册 2 年',txt:'等了 11 天退款都没处理，客服一直说在核实。<mark>这家店就是骗子</mark>，大家别买。',img:[0,0,0],h:'真实差评含一处人身攻击，建议仅隐去该词后通过',hits:[['人身攻击 · “骗子”','规则 5.1'],['订单真实 · 售后已超时','订单 SH2410170931']],btn:'隐去 1 处后通过'},
 {g:'prog',grp:'需复核',t:'「双十一攻略合集」',m:'省钱研究所 · 长文 · 外链 4 个',w:'12 分',au:'省钱研究所',lv:'Lv7',txt:'整理了 32 个品类的满减规则……',img:[0,0,0],h:'含 4 个外部链接，均为官方活动页',hits:[['外链 4 个 · 白名单域名','规则 3.1']],btn:'通过'},
 {g:'todo',grp:'需复核',t:'「门店探访 vlog」',m:'阿杰 · 视频 · 4:12',w:'20 分',au:'阿杰',lv:'Lv3',txt:'带大家看看朝阳门店新上的秋冬系列。',img:[0,0,0],h:'未命中规则，人工抽检',hits:[],btn:'通过'}];
var cur=0,done={};
function rl(){var h='',l='';Q.forEach(function(q,i){if(done[i])return;if(q.grp!==l){h+='<div class="grp">'+q.grp+'</div>';l=q.grp;}h+='<div class="it'+(i===cur?' on':'')+'" data-i="'+i+'">'+G(q.g)+'<span class="t">'+q.t+'</span><span class="a"></span><span class="m">'+q.m+'</span><span class="w'+(q.late?' late':'')+'">'+q.w+'</span></div>';});
document.getElementById('list').innerHTML=h;document.querySelectorAll('.it').forEach(function(e){e.onclick=function(){cur=+e.dataset.i;R();};});}
function rf(){var q=Q[cur];document.getElementById('focus').innerHTML='<div class="verdict"><div class="eyebrow">'+(q.late?'<span class="late">'+G('late')+'疑似违规</span>':'<span>需复核</span>')+'<span>·</span><span>第 '+(cur+1)+' / '+Q.length+' 条</span></div><h2>'+q.h+'</h2></div>'+
'<div class="body"><div><div class="sec">原文 · 命中处带红色波浪线</div><div class="post"><div class="au"><span class="av2">'+q.au[0]+'</span><b>'+q.au+'</b>'+q.lv+' · 10-17 01:42</div><p>'+q.txt+'</p><div class="imgs">'+q.img.map(function(x,i){return '<div class="'+(x?'hit':'')+'">图 '+(i+1)+(x?' · 二维码':'')+'</div>';}).join('')+'</div></div></div>'+
'<aside><div class="sec">命中</div>'+(q.hits.length?'<ul class="hits">'+q.hits.map(function(x){return '<li>'+x[0]+'<span>'+x[1]+'</span></li>';}).join('')+'</ul>':'<p class="muted">无</p>')+'<div class="note">驳回会通知作者并附理由，作者可在 3 天内申诉。</div></aside></div>'+
'<div class="act"><div class="cons"><span><i></i>5 分钟内可撤销</span><span><i class="w"></i>作者会收到通知</span></div><div class="r"><button class="btn btn-g">跳过 <span class="k">L</span></button><button class="btn btn-s">通过 <span class="k">A</span></button><button class="btn btn-p" id="go">'+q.btn+' <span class="k">E</span></button></div></div>';document.getElementById('go').onclick=ap;}
function R(){rl();rf();}var lst=null;function ap(){done[cur]=1;lst=cur;toast('已处理：'+Q[cur].btn);for(var i=0;i<Q.length;i++)if(!done[i]){cur=i;break;}R();}
function undo(){if(lst===null)return;delete done[lst];cur=lst;lst=null;document.getElementById('toast').classList.remove('show');R();}
document.addEventListener('keydown',function(e){if(e.target.closest('textarea,input'))return;if(e.key==='j'&&cur<Q.length-1){cur++;R();}if(e.key==='k'&&cur>0){cur--;R();}if(e.key==='e')ap();if(e.key==='z')undo();});R();
</script>
