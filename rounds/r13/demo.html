 <div class="work">

   <div class="qhead"><h1>今天要办完 <span>9 件 · 最急的已等 11 天</span></h1>

<div class="toast" id="toast"><span id="tmsg"></span><button onclick="undo()">撤销 <span class="k" style="border-color:rgba(255,255,255,.25);color:#ccc">Z</span></button></div>
<script>
var Q=[
 {g:'late',grp:'超时',t:'6 笔退款等你批准',m:'朝阳门店等 4 店 · 均低于免审阈值',a:[4218,0],w:'11 天',late:1,
  h:'批准 6 笔超时退款，共 <span class="amt"><s>¥</s>4,218<i>.00</i></span>',p:'门店都已确认商品问题，单笔都低于 ¥1,500 免审阈值。建议原路退款，不要求寄回。',
  f:[['最久等待','11 天'],['涉及门店','4 家'],['客户投诉','2 起']],
  rows:[['刘佳琪','苏州 · 观前店','香薰礼盒破损，已上传照片',11,238],['王梓涵','上海 · 徐汇店','耳机左耳无声，门店已检测',9,799],['赵一鸣','南京 · 新街口店','保温杯发错颜色',8,356],['陈思远','杭州 · 湖滨店','双肩包拉链损坏',7,699],['吴俊杰','苏州 · 观前店','重复扣款',4,1490],['郑可欣','上海 · 徐汇店','未收到货',3,636]],
  cons:[['','10 分钟内可撤销'],['w','之后进入支付通道，无法撤回']],btn:'批准 6 笔'},
 {g:'late',grp:'超时',t:'2 笔待发货已超时',m:'林晓雯、赵一鸣 · 需填写运单号',a:[0,0],w:'2 小时',late:1,h:'2 笔订单发货超时 2 小时，补填运单号即可发出',p:'仓库已打包，缺运单号。填写后系统自动通知客户。',f:[['超时','2 小时'],['仓库','华东一仓']],rows:[['林晓雯','上海 · 静安店','运单号未填',0,329],['赵一鸣','南京 · 新街口店','运单号未填',0,1180]],cons:[['','可随时修改运单号']],btn:'发出 2 单'},
 {g:'prog',grp:'今天',t:'14 笔未付款即将关闭',m:'30 分钟内自动关闭 · 可催付一次',a:[0,0],w:'30 分',h:'14 笔未付款订单 30 分钟后自动关闭',p:'每笔只能催付一次；关闭后库存自动释放。',f:[['金额合计','¥9,820'],['可催付','14 笔']],rows:[],cons:[['w','每笔只能催付一次']],btn:'催付 14 笔'},
 {g:'todo',grp:'今天',t:'3 张发票待开具',m:'企业客户 · 月结',a:[12600,0],w:'今天'},
 {g:'todo',grp:'今天',t:'新品「秋冬礼盒」待上架审核',m:'商品部 · 12 个 SKU',a:[0,0],w:'今天'},
 {g:'prog',grp:'本周',t:'望京门店结算对账差异',m:'差 ¥312.40 · 财务已介入',a:[312,40],w:'周五'},
 {g:'todo',grp:'本周',t:'华东区 10 月促销复盘',m:'运营 · 草稿',a:[0,0],w:'周五'},
 {g:'todo',grp:'本周',t:'2 位员工权限申请',m:'门店店长 → 区域查看',a:[0,0],w:'周六'},
 {g:'done',grp:'本周',t:'国庆活动退款清算',m:'已完成 · 等财务确认',a:[0,0],w:'—'}];
function money(n,d){return n?'<span class="amt"><s>¥</s>'+n.toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>':'';}
var cur=0,doneSet={};
function renderList(){var h='',last='';Q.forEach(function(q,i){if(doneSet[i])return;if(q.grp!==last){h+='<div class="grp">'+q.grp+'</div>';last=q.grp;}
 h+='<div class="it'+(i===cur?' on':'')+'" data-i="'+i+'" tabindex="0"><svg class="g '+q.g+'"><use href="#g-'+q.g+'"/></svg><span class="t">'+q.t+'</span><span class="a">'+money(q.a[0],q.a[1])+'</span><span class="m">'+q.m+'</span><span class="w'+(q.late?' late':'')+'">'+q.w+'</span></div>';});
 document.getElementById('list').innerHTML=h;document.querySelectorAll('.it').forEach(function(e){e.onclick=function(){cur=+e.dataset.i;render();};});}
function renderFocus(){var q=Q[cur],F=document.getElementById('focus');
 if(!q.h){F.innerHTML='<div class="verdict"><div class="eyebrow"><svg class="g '+q.g+'"><use href="#g-'+q.g+'"/></svg>'+q.grp+' · '+q.w+'</div><h2>'+q.t+'</h2><p>'+q.m+'</p></div><div class="body"><div><div class="sec">明细</div><p style="color:var(--color-text-tertiary)">演示数据只做了前三件。按 <span class="k">K</span> 回到上一件。</p></div></div><div class="act"><div class="r"><button class="btn btn-s">打开</button></div></div>';return;}
 var rows=q.rows.map(function(r){return '<tr><td>'+r[0]+'<span class="sub">'+r[1]+'</span></td><td style="color:var(--color-text-secondary)">'+r[2]+'</td><td>'+(r[3]?'<span class="age'+(r[3]<5?' ok':'')+'"><i><b style="width:'+Math.min(100,r[3]*9)+'%"></b></i>'+r[3]+' 天</span>':'')+'</td><td class="n">'+money(r[4],0)+'</td></tr>';}).join('');
 F.innerHTML='<div class="verdict"><div class="eyebrow">'+(q.late?'<span class="late"><svg class="g late"><use href="#g-late"/></svg>已超时 '+q.w+'</span>':'<span>'+q.w+'</span>')+'<span>·</span><span>第 '+(cur+1)+' / '+Q.length+' 件</span></div><h2>'+q.h+'</h2><p>'+q.p+'</p><div class="facts">'+q.f.map(function(x){return '<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>';}).join('')+'</div></div>'+
 '<div class="body"><div>'+(rows?'<div class="sec"><span>明细 · '+q.rows.length+' 笔</span><span>按等待时间排序</span></div><table><tr><th>客户</th><th>原因</th><th>已等待</th><th class="n">金额</th></tr>'+rows+'</table>':'<div class="sec">明细</div><p style="color:var(--color-text-tertiary)">批量操作，无需逐笔查看。</p>')+'</div>'+
 '<aside><div class="sec">经过</div><ol class="spine"><li><b>客户申请退款</b><time>10-05 14:20</time></li><li><b>门店确认问题</b><time>10-06 09:02 · 4 家门店</time></li><li><b>超过 48 小时未处理</b><time>10-07 · 系统标记超时</time></li><li class="now"><b>等你批准</b><time>现在</time></li><li><b>原路退款到账</b><time>批准后 1–3 天</time></li></ol><div class="note">免审阈值 ¥1,500。本批最大单笔 ¥1,490，未超出。</div></aside></div>'+
 '<div class="act"><div class="cons">'+q.cons.map(function(c){return '<span><i class="'+c[0]+'"></i>'+c[1]+'</span>';}).join('')+'</div><div class="r"><button class="btn btn-g">稍后 <span class="k">L</span></button><button class="btn btn-s">逐笔核对</button><button class="btn btn-p" id="go">'+q.btn+(q.a[0]?' · ¥'+q.a[0].toLocaleString():'')+' <span class="k">E</span></button></div></div>';
 document.getElementById('go').onclick=approve;}
function render(){renderList();renderFocus();}
var lastDone=null,tt;
function approve(){var q=Q[cur];if(!q.btn)return;doneSet[cur]=1;lastDone=cur;document.getElementById('tmsg').textContent='已'+q.btn.replace(/ .*/,'')+'：'+q.t;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){T.classList.remove('show');},5000);
 for(var i=0;i<Q.length;i++)if(!doneSet[i]){cur=i;break;}render();}
function undo(){if(lastDone===null)return;delete doneSet[lastDone];cur=lastDone;lastDone=null;document.getElementById('toast').classList.remove('show');render();}
function step(d){var i=cur;do{i+=d;}while(i>=0&&i<Q.length&&doneSet[i]);if(i>=0&&i<Q.length){cur=i;render();}}
document.addEventListener('keydown',function(e){if(e.target.closest('textarea,input'))return;if(e.key==='j')step(1);if(e.key==='k')step(-1);if(e.key==='e')approve();if(e.key==='z')undo();});
render();
</script>
