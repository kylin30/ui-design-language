<div class="desk">
 <header class="bar"><div class="crumb">云栈运营 / <b>运维 · 告警</b></div><span data-demo-nav></span>
  <div class="cmd" title="命令面板"><svg class="ico" style="width:14px;height:14px"><use href="#i-search"/></svg>搜索或输入命令…<kbd>⌘K</kbd></div>
  <div class="r"><span data-theme-slot></span><span class="sync">已同步 20:30</span></div></header>
<div class="work"><section class="queue"><div class="qhead"><h1>告警 <span>3 条在响 · 1 条影响支付</span></h1><div class="lanes"><button class="on">在响 <em>3</em></button><button>已确认 <em>5</em></button><button>已恢复 <em>27</em></button></div></div><div class="list" id="list"></div></section><section class="focus" id="focus"></section></div>

<div class="toast" id="toast"><span id="tmsg"></span><button onclick="window.undo&&undo()">撤销 <span class="k" style="border-color:rgba(255,255,255,.25);color:#ccc">Z</span></button></div>
<script>
function G(k,c){return '<svg class="g '+(c||k)+'"><use href="#g-'+k+'"/></svg>';}
function money(n,d){return '<span class="amt"><s>¥</s>'+Math.floor(n).toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>';}
var _tt;function toast(m){document.getElementById('tmsg').textContent=m;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){T.classList.remove('show');},5000);}

var Q=[{g:'late',grp:'P1 · 影响用户',t:'支付网关 P99 延迟 2.4s',m:'pay-gateway · 华东 2 区 · v2.32',w:'14 分',late:1,
 h:'支付网关 P99 延迟 2.4 秒，超阈值 4 倍；始于 v2.32 发布后 6 分钟',p:'错误率 0.9%（平时 0.05%），约 1,200 笔/分钟支付受影响。上一个稳定版本 v2.31，回滚约需 3 分钟。',
 f:[['P99 延迟','2.41 s'],['错误率','0.9 %'],['受影响','1,200 笔/分']],btn:'回滚到 v2.31',cons:[['','回滚可再次发布 v2.32'],['w','回滚期间约 40 秒只读']]},
 {g:'late',grp:'P1 · 影响用户',t:'订单库主从延迟 38s',m:'order-db-02 · 只读查询变慢',w:'9 分',late:1,h:'订单库从库延迟 38 秒，后台查询可能看到旧数据',p:'主库写入正常。延迟来自 02:00 的批量对账任务，预计 15 分钟内追平。',f:[['延迟','38 s'],['QPS','4,210']],btn:'暂停对账任务',cons:[['','任务可随时恢复']]},
 {g:'prog',grp:'P3 · 观察中',t:'CDN 命中率降至 86%',m:'static.yunzhan.cn · 回源增加',w:'1 时',h:'CDN 命中率 86%，低于 92% 目标，暂不影响用户',p:'新版首页资源未预热，已自动预热 70%。',f:[['命中率','86 %'],['回源带宽','1.8 Gbps']],btn:'确认并观察',cons:[['','30 分钟后自动复查']]},
 {g:'todo',grp:'P3 · 观察中',t:'日志磁盘 78%',m:'log-03 · 按当前速度 3 天后满',w:'3 时',h:'日志磁盘 78%，约 3 天后写满',p:'可清理 30 天前日志释放约 40%。',f:[['使用率','78 %']],btn:'清理 30 天前日志',cons:[['w','清理后无法恢复']]}];
var cur=0,done={};
function rl(){var h='',l='';Q.forEach(function(q,i){if(done[i])return;if(q.grp!==l){h+='<div class="grp">'+q.grp+'</div>';l=q.grp;}h+='<div class="it'+(i===cur?' on':'')+'" data-i="'+i+'">'+G(q.g)+'<span class="t">'+q.t+'</span><span class="a"></span><span class="m">'+q.m+'</span><span class="w'+(q.late?' late':'')+'">'+q.w+'</span></div>';});
document.getElementById('list').innerHTML=h;document.querySelectorAll('.it').forEach(function(e){e.onclick=function(){cur=+e.dataset.i;R();};});}
function chart(){var a=[180,175,190,182,188,176,185,620,1450,1980,2210,2380,2410,2350,2400],W=600,H=120,mx=2600;function X(i){return i*W/14;}function Y(v){return H-6-v/mx*(H-16);}
var p=a.map(function(v,i){return (i?'L':'M')+X(i)+','+Y(v);}).join('');var g='<line x1="0" x2="'+W+'" y1="'+Y(600)+'" y2="'+Y(600)+'" stroke="var(--color-chart-4)" stroke-dasharray="4 4"/><text x="'+(W-4)+'" y="'+(Y(600)-4)+'" font-size="10" text-anchor="end" fill="var(--color-text-tertiary)">阈值 600ms</text>';
g+='<line x1="'+X(6.5)+'" x2="'+X(6.5)+'" y1="0" y2="'+H+'" stroke="var(--color-border-strong)"/><text x="'+(X(6.5)+4)+'" y="12" font-size="10" fill="var(--color-text-tertiary)">v2.32 发布 02:03</text>';
g+='<path d="'+p+'" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.5"/><path d="'+a.map(function(v,i){return i<7?'':((i==7?'M':'L')+X(i)+','+Y(v));}).join('')+'" fill="none" stroke="var(--color-danger)" stroke-width="2"/>';
return '<svg class="metric" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+'</svg>';}
function rf(){var q=Q[cur];document.getElementById('focus').innerHTML='<div class="verdict"><div class="eyebrow">'+(q.late?'<span class="late">'+G('late')+'持续 '+q.w+'</span>':'<span>'+q.w+'</span>')+'<span>·</span><span>值班：周凯</span></div><h2>'+q.h+'</h2><p>'+q.p+'</p><div class="facts">'+q.f.map(function(x){return '<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>';}).join('')+'</div></div>'+
'<div class="body"><div>'+(cur===0?'<div class="sec"><span>P99 延迟 · 近 30 分钟</span><span>红色段 = 越线</span></div>'+chart()+'<div class="sec"><span>受影响的服务</span></div><table><tr><th>服务</th><th>状态</th><th class="n">错误率</th><th class="n">P99</th></tr><tr><td>pay-gateway</td><td><span class="st2 late">'+G('late')+'越线</span></td><td class="n">0.90%</td><td class="n">2,410 ms</td></tr><tr><td>order-api</td><td><span class="st2">'+G('prog')+'受牵连</span></td><td class="n">0.21%</td><td class="n">880 ms</td></tr><tr><td>coupon-svc</td><td><span class="st2">'+G('done')+'正常</span></td><td class="n">0.02%</td><td class="n">96 ms</td></tr></table>':'<div class="sec">明细</div><p class="muted">演示数据只展开第一条。</p>')+'</div>'+
'<aside><div class="sec">经过</div><ol class="spine"><li><b>v2.32 发布</b><time>02:03 · 发布人 李航</time></li><li><b>延迟开始上升</b><time>02:09</time></li><li><b>触发 P1，电话通知值班</b><time>02:12</time></li><li class="now"><b>等你决定</b><time>现在 02:26</time></li><li><b>回滚后 3 分钟内恢复</b><time>预计</time></li></ol><div class="note">同类故障 9 月 21 日出现过一次，当时回滚 3 分钟内恢复。</div></aside></div>'+
'<div class="act"><div class="cons">'+q.cons.map(function(c){return '<span><i class="'+c[0]+'"></i>'+c[1]+'</span>';}).join('')+'</div><div class="r"><button class="btn btn-g">稍后 <span class="k">L</span></button><button class="btn btn-s">打开监控</button><button class="btn btn-p" id="go">'+q.btn+' <span class="k">E</span></button></div></div>';document.getElementById('go').onclick=ap;}
function R(){rl();rf();}var lst=null;function ap(){done[cur]=1;lst=cur;toast('已执行：'+Q[cur].btn);for(var i=0;i<Q.length;i++)if(!done[i]){cur=i;break;}R();}
function undo(){if(lst===null)return;delete done[lst];cur=lst;lst=null;document.getElementById('toast').classList.remove('show');R();}
document.addEventListener('keydown',function(e){if(e.target.closest('textarea,input'))return;if(e.key==='j'&&cur<Q.length-1){cur++;R();}if(e.key==='k'&&cur>0){cur--;R();}if(e.key==='e')ap();if(e.key==='z')undo();});R();
</script>
