 document.querySelectorAll('#list .row').forEach(function(r){r.onclick=function(){cur=+r.dataset.i;render();};});
 var q=Q[cur],D=document.getElementById('detail');if(!q||q.gone){D.innerHTML='<div class="empty" style="flex:1"><b>没有选中的任务</b></div>';return;}

 D.innerHTML='<div class="ch"><h2>'+q.t+'</h2><span class="tag '+q.s[0]+'">'+q.s[1]+'</span><span class="r meta">'+(cur+1)+' / '+Q.length+'</span></div><div class="dbody"><div class="cb"><p class="sec">'+q.sum+'</p><dl class="dl" style="margin-top:16px">'+q.dl.map(function(d){return '<div><dt>'+d[0]+'</dt><dd>'+d[1]+'</dd></div>';}).join('')+(q.big?'<div style="display:none"></div>':'')+'</dl></div>'+(tbl?'<div class="dgrp"><div class="grp-h">明细<span>'+q.rows.length+' 笔</span></div>'+tbl+(q.big?'<div class="tot"><span class="sec">合计</span><b>'+money(q.big)+'</b></div>':'')+'</div>':'')+'<div class="act-log"><h3>动态</h3><ol><li><b>系统</b>从 '+q.dl[0][1]+' 汇总生成此任务<time>今天 09:12</time></li><li><b>林悦</b>指派给你，并备注“'+q.m+'”<time>40 分钟前</time></li><li><b>你</b>打开了此任务<time>刚刚</time></li></ol></div></div><div class="cf"><span>'+q.cons+'</span><span class="r"><button class="btn btn-s" id="skip">稍后<kbd>J</kbd></button><button class="btn btn-p" id="go">'+q.act+'<kbd>E</kbd></button></span></div>';

function next(){for(var k=1;k<=Q.length;k++){var j=(cur+k)%Q.length;if(!Q[j].gone){cur=j;break;}}render();}
function finish(){var i=cur,q=Q[i];q.gone=1;done++;upd();next();toast('已完成：'+q.t,function(){q.gone=0;done--;cur=i;upd();render();});}
function seg(){var c=[0,0,0];Q.forEach(function(q){if(!q.gone)c[gi(q)]++;});var t=c[0]+c[1]+c[2];document.getElementById('kseg').innerHTML=t?c.map(function(n,k){return n?'<i class="s'+k+'" style="flex:'+n+'"></i>':'';}).join(''):'';document.getElementById('kBad').textContent=c[0];document.getElementById('kToday').textContent=c[1];document.getElementById('sBad').textContent=c[0];document.getElementById('sLeft').textContent=t;document.getElementById('sBad').parentNode.className=c[0]?'bad':'';document.getElementById('kBad').parentNode.className=c[0]?'bad':'';var nb=document.querySelector('.nv.on .c');if(nb)nb.textContent=t;}
