<script>
function G(k){return '<svg class="g '+k+'"><use href="#g-'+k+'"/></svg>';}
function money(n,d){return '<span class="amt"><s>¥</s>'+Math.floor(n).toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>';}
var _tt;function toast(m){document.getElementById('tmsg').textContent=m;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){T.classList.remove('show');},5000);}
function countUp(root){(root||document).querySelectorAll('[data-count]').forEach(function(el){var to=parseFloat(el.dataset.count),dec=(el.dataset.count.split('.')[1]||'').length,t0=null,dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:700;
 function f(t){if(!t0)t0=t;var p=dur?Math.min(1,(t-t0)/dur):1;p=1-Math.pow(1-p,3);el.textContent=(to*p).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});if(p<1)requestAnimationFrame(f);}requestAnimationFrame(f);});}
function dots(n,cls,cols){var h='';for(var i=0;i<n;i++)h+='<i class="'+(cls(i)||'')+'" style="animation-delay:'+(i*8)+'ms"></i>';return '<div class="dots" style="grid-template-columns:repeat('+(cols||12)+',1fr)">'+h+'</div>';}
function area(el,S,o){o=o||{};var W=760,H=o.h||220,P=28,all=[].concat.apply([],S.map(function(s){return s.d;})),mx=o.max||Math.max.apply(0,all)*1.1,mn=o.min||0,n=S[0].d.length;
 function X(i){return P+i*(W-P-8)/(n-1);}function Y(v){return H-22-(v-mn)/(mx-mn)*(H-40);}
 var g='<defs><linearGradient id="ga'+el.id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--color-primary)" stop-opacity=".22"/><stop offset="1" stop-color="var(--color-primary)" stop-opacity="0"/></linearGradient></defs>';
 (o.grid||[]).forEach(function(v){g+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--color-divider)"/><text x="0" y="'+(Y(v)+4)+'" font-size="10.5" fill="var(--color-text-tertiary)" font-family="var(--font-mono)">'+v+'</text>';});
 if(o.target)g+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(o.target)+'" y2="'+Y(o.target)+'" stroke="var(--color-chart-4)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>';
 S.forEach(function(s){var p=s.d.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);}).join('');
  if(s.fill)g+='<path d="'+p+'L'+X(n-1)+','+(H-22)+'L'+X(0)+','+(H-22)+'Z" fill="url(#ga'+el.id+')"/>';
  g+='<path d="'+p+'" fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2.25)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="4 4"':'')+' pathLength="1" style="stroke-dasharray:'+(s.dash?'':'1')+';stroke-dashoffset:'+(s.dash?'0':'1')+';animation:draw 1.1s var(--ease-out) forwards"/>';});
 (o.marks||[]).forEach(function(m){g+='<circle cx="'+X(m.i)+'" cy="'+Y(m.v)+'" r="5" fill="'+(m.c||'var(--color-danger)')+'" stroke="var(--color-surface)" stroke-width="2.5"/>'+(m.t?'<text x="'+(X(m.i)+10)+'" y="'+(Y(m.v)+18)+'" font-size="11.5" font-weight="600" fill="'+(m.c||'var(--color-danger)')+'">'+m.t+'</text>':'');});
 (o.xl||[]).forEach(function(l){g+='<text x="'+X(l[0])+'" y="'+(H-4)+'" font-size="10.5" text-anchor="middle" fill="var(--color-text-tertiary)" font-family="var(--font-mono)">'+l[1]+'</text>';});
 g+='<line class="hv" x1="0" x2="0" y1="8" y2="'+(H-22)+'" stroke="var(--color-border-strong)" opacity="0"/><circle class="hd" r="4.5" fill="var(--color-primary)" stroke="var(--color-surface)" stroke-width="2" opacity="0"/>';
 el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;overflow:visible" preserveAspectRatio="none">'+g+'</svg><div class="tip"></div>';
 var sv=el.querySelector('svg'),tip=el.querySelector('.tip'),hv=el.querySelector('.hv'),hd=el.querySelector('.hd');
 el.onmousemove=function(e){var r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-P)/((W-P-8)/(n-1)))));
  hv.setAttribute('x1',X(i));hv.setAttribute('x2',X(i));hv.setAttribute('opacity',1);hd.setAttribute('cx',X(i));hd.setAttribute('cy',Y(S[0].d[i]));hd.setAttribute('opacity',1);
  tip.style.left=(X(i)/W*r.width)+'px';tip.style.top=(Y(S[0].d[i])/H*r.height)+'px';tip.style.opacity=1;tip.innerHTML=(o.label?o.label(i):'')+' · <b>'+S[0].d[i]+(o.unit||'')+'</b>';};
 el.onmouseleave=function(){tip.style.opacity=0;hv.setAttribute('opacity',0);hd.setAttribute('opacity',0);};}

var Q=[{g:'late',grp:'超时',t:'6 笔退款等你批准',m:'4 家门店 · 均低于免审阈值',w:'11 天',late:1,h:'批准 6 笔超时退款',big:4218,p:'门店都已确认商品问题，单笔都低于 ¥1,500 免审阈值。建议原路退款，不要求寄回。',

 {g:'prog',grp:'今天',t:'14 笔未付款即将关闭',m:'30 分钟后自动关闭',w:'30 分',h:'催付 14 笔未付款订单',big:9820,p:'每笔只能催付一次；关闭后库存自动释放。',rows:[],cons:[['w','每笔只能催付一次']],btn:'催付 14 笔'},

 {g:'todo',grp:'今天',t:'「秋冬礼盒」待上架审核',m:'商品部 · 12 个 SKU',w:'今天',h:'审核 12 个新 SKU',big:0,p:'图片、价格、库存均已填写。',rows:[],cons:[['','上架后可随时下架']],btn:'通过上架'},
 {g:'prog',grp:'本周',t:'望京门店对账差异',m:'差 ¥312.40 · 财务已介入',w:'周五',h:'确认望京门店对账差异',big:312,p:'差额来自一笔重复的优惠券核销。',rows:[],cons:[['','可随时重新对账']],btn:'确认差异'}];
function detail(q){var rows=q.rows.map(function(r){return '<tr><td>'+r[0]+'<span class="sub">'+r[1]+'</span></td><td class="muted">'+r[2]+'</td><td style="width:150px">'+(r[3]?'<div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1;height:6px"><b class="'+(r[3]>=5?'bad':'mute')+'" style="width:'+Math.min(100,r[3]*9)+'%"></b></div><span style="font-size:12.5px;width:36px">'+r[3]+' 天</span></div>':'')+'</td><td class="n">'+money(r[4])+'</td></tr>';}).join('');
 return '<div class="card verdict"><div class="eyebrow">'+(q.late?'<span class="tag bad">已超时 '+q.w+'</span>':'<span class="tag">'+q.w+'</span>')+'<span>第 '+(cur+1)+' / '+Q.length+' 件</span></div><div style="display:flex;align-items:flex-end;gap:32px"><div style="flex:1"><div class="display">'+q.h+'</div><p class="lede" style="margin-top:10px">'+q.p+'</p></div>'+(q.big?'<div style="text-align:right"><div class="eyebrow" style="justify-content:flex-end">合计</div><div class="fig xl" style="margin-top:8px">¥<span data-count="'+q.big+'">'+q.big+'</span></div></div>':'')+'</div></div>'+

var cur=0,done={},lst=null;
function rl(){var h='',l='';Q.forEach(function(q,i){if(done[i])return;if(q.grp!==l){h+='<div class="grp">'+q.grp+'</div>';l=q.grp;}
 h+='<div class="it'+(i===cur?' on':'')+'" data-i="'+i+'">'+G(q.g)+'<span class="t">'+q.t+'</span><span class="w'+(q.late?' late':'')+'">'+q.w+'</span><span class="m">'+q.m+'</span></div>';});
 document.getElementById('list').innerHTML=h;document.querySelectorAll('#list .it').forEach(function(e){e.onclick=function(){cur=+e.dataset.i;R();};});}
function R(){rl();var F=document.getElementById('focus');F.innerHTML=detail(Q[cur]);F.classList.remove('enter');void F.offsetWidth;F.classList.add('enter');
 var A=document.getElementById('act');A.innerHTML=actbar(Q[cur]);var b=document.getElementById('go');if(b)b.onclick=ap;countUp(F);if(window.after)after();}
function actbar(q){return '<div class="cons">'+(q.cons||[]).map(function(c){return '<span><i class="'+c[0]+'"></i>'+c[1]+'</span>';}).join('')+'</div><div class="r"><button class="btn btn-g">稍后 <span class="k">L</span></button>'+(q.sec?'<button class="btn btn-s">'+q.sec+'</button>':'')+'<button class="btn btn-p" id="go">'+q.btn+' <span class="k">E</span></button></div>';}
function ap(){done[cur]=1;lst=cur;toast('已完成：'+Q[cur].btn+(Q[cur].btn?'':''));for(var i=0;i<Q.length;i++)if(!done[i]){cur=i;break;}R();}
function undo(){if(lst===null)return;delete done[lst];cur=lst;lst=null;document.getElementById('toast').classList.remove('show');R();}
document.addEventListener('keydown',function(e){if(e.target.closest('textarea,input'))return;var k=e.key;function st(d){var i=cur;do{i+=d;}while(i>=0&&i<Q.length&&done[i]);if(i>=0&&i<Q.length){cur=i;R();}}
 if(k==='j')st(1);if(k==='k')st(-1);if(k==='e')ap();if(k==='z')undo();});
R();
countUp();</script>
