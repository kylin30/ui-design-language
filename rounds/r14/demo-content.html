<style>@keyframes draw{to{stroke-dashoffset:0}}.work{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.q{padding:8px;position:sticky;top:14px}.q .qh{padding:12px 16px 4px;display:flex;align-items:baseline;gap:8px}.q .qh b{font-size:15px;font-weight:620}
.seg{display:flex;gap:2px;margin:10px 8px 4px;padding:3px;border-radius:9px;background:var(--color-surface-subtle)}.seg button{flex:1;height:28px;border:0;border-radius:7px;background:none;font-size:12.5px;color:var(--color-text-secondary);cursor:pointer}.seg button.on{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:var(--shadow-card)}.seg em{font-style:normal;color:var(--color-text-tertiary);margin-left:4px}
.det{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
.verdict{padding:28px 32px}.verdict .eyebrow{margin-bottom:12px}

.post{border-radius:12px;background:var(--color-surface-subtle);padding:18px}.post .au{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--color-text-tertiary)}.post .au b{color:var(--color-text)}
.post p{margin-top:12px;font-size:15px;line-height:26px}.post mark{background:var(--color-danger-soft);color:var(--color-danger-text);border-radius:4px;padding:1px 3px;text-decoration:underline wavy var(--color-danger);text-underline-offset:4px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.imgs div{aspect-ratio:4/3;border-radius:10px;background:linear-gradient(135deg,var(--color-surface-hover),var(--color-surface));box-shadow:inset 0 0 0 1px var(--color-hairline);display:grid;place-items:center;font-size:12px;color:var(--color-text-tertiary)}.imgs div.hit{box-shadow:inset 0 0 0 2px var(--color-danger);color:var(--color-danger-text)}
.hits{list-style:none}.hits li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:13px}.hits li:last-child{border:0}.hits li span{margin-left:auto}
.conf{display:flex;gap:3px;align-items:flex-end;height:14px}.conf i{width:4px;border-radius:1px;background:var(--color-border-strong)}.conf i.on{background:var(--color-danger)}
</style></head>
<body>

<div class="app">

<main class="main">
<div class="top"><div class="crumb">云栈运营 / <b>内容 · 审核队列</b></div><span data-demo-nav></span><div class="r"><div class="cmd"><svg class="ico" style="width:14px;height:14px"><use href="#i-search"/></svg>搜索或输入命令<kbd>⌘K</kbd></div><span data-theme-slot></span></div></div>
<section class="card hero enter"><div><div class="eyebrow">内容审核 · 今日</div><div class="display xl"><span data-count="37">37</span> 条等人来判断</div><p class="lede">机审已经拦下 <b>112 条</b>、放行 <b>2,846 条</b>；剩下拿不准的交给你。最可疑的排在最前，平均每条 <b>40 秒</b>。</p></div>
<div class="hero-r"><div class="eyebrow" style="margin-bottom:14px">今天 2,995 条内容的去向</div><div id="dm"></div><div class="legend" style="margin-top:12px"><span><i style="background:var(--color-border-strong)"></i>自动放行 95%</span><span><i style="background:var(--color-text-tertiary)"></i>自动拦截 3.7%</span><span><i style="background:var(--color-primary)"></i>需人审 1.3%</span></div></div></section>
<div class="work"><div class="card q"><div class="qh"><b>待审</b><span class="muted" style="font-size:12.5px">37 条</span></div><div class="seg"><button class="on">需人审<em>37</em></button><button class="">申诉<em>4</em></button><button class="">已审<em>286</em></button></div><div id="list"></div></div><div id="focus"></div></div><div class="act" id="act"></div>
</main></div>
<div class="toast" id="toast"><span id="tmsg"></span><button onclick="window.undo&&undo()">撤销 Z</button></div>
<script>
function G(k){return '<svg class="g '+k+'"><use href="#g-'+k+'"/></svg>';}
function money(n,d){return '<span class="amt"><s>¥</s>'+Math.floor(n).toLocaleString()+'<i>.'+String(d||0).padStart(2,'0')+'</i></span>';}
var _tt;function toast(m){document.getElementById('tmsg').textContent=m;var T=document.getElementById('toast');T.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){T.classList.remove('show');},5000);}
function countUp(root){(root||document).querySelectorAll('[data-count]').forEach(function(el){var to=parseFloat(el.dataset.count),dec=(el.dataset.count.split('.')[1]||'').length,t0=null,dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:700;
 function f(t){if(!t0)t0=t;var p=dur?Math.min(1,(t-t0)/dur):1;p=1-Math.pow(1-p,3);el.textContent=(to*p).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});if(p<1)requestAnimationFrame(f);}requestAnimationFrame(f);});}
function dots(n,cls,cols){var h='';for(var i=0;i<n;i++)h+='<i class="'+(cls(i)||'')+'" style="animation-delay:'+(i*8)+'ms"></i>';return '<div class="dots" style="grid-template-columns:repeat('+(cols||12)+',1fr)">'+h+'</div>';}
function area(el,S,o){o=o||{};var W=760,H=o.h||220,P=28,all=[].concat.apply([],S.map(function(s){return s.d;})),mx=o.max||Math.max.apply(0,all)*1.1,mn=o.min||0,n=S[0].d.length;
 function X(i){return P+i*(W-P-8)/(n-1);}function Y(v){return H-22-(v-mn)/(mx-mn)*(H-40);}
 var g='<defs><linearGradient id="ga'+el.id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--color-primary)" stop-opacity=".22"/><stop offset="1" stop-color="var(--color-primary)" stop-opacity="0"/></linearGradient></defs>';
 (o.grid||[]).forEach(function(v){g+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--color-divider)"/><text x="0" y="'+(Y(v)+4)+'" font-size="10.5" fill="var(--color-text-tertiary)" font-family="var(--font-mono)">'+v+'</text>';});
 if(o.target)g+='<line x1="'+P+'" x2="'+W+'" y1="'+Y(o.target)+'" y2="'+Y(o.target)+'" stroke="var(--color-chart-4)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>';
 S.forEach(function(s){var p=s.d.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);}).join('');
  if(s.fill)g+='<path d="'+p+'L'+X(n-1)+','+(H-22)+'L'+X(0)+','+(H-22)+'Z" fill="url(#ga'+el.id+')"/>';
  g+='<path d="'+p+'" fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2.25)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="4 4"':'')+' pathLength="1" style="stroke-dasharray:'+(s.dash?'':'1')+';stroke-dashoffset:'+(s.dash?'0':'1')+';animation:draw 1.1s var(--ease-out) forwards"/>';});
 (o.marks||[]).forEach(function(m){g+='<circle cx="'+X(m.i)+'" cy="'+Y(m.v)+'" r="5" fill="'+(m.c||'var(--color-danger)')+'" stroke="var(--color-surface)" stroke-width="2.5"/>'+(m.t?'<text x="'+(X(m.i)+10)+'" y="'+(Y(m.v)+18)+'" font-size="11.5" font-weight="600" fill="'+(m.c||'var(--color-danger)')+'">'+m.t+'</text>':'');});
 (o.xl||[]).forEach(function(l){g+='<text x="'+X(l[0])+'" y="'+(H-4)+'" font-size="10.5" text-anchor="middle" fill="var(--color-text-tertiary)" font-family="var(--font-mono)">'+l[1]+'</text>';});
 g+='<line class="hv" x1="0" x2="0" y1="8" y2="'+(H-22)+'" stroke="var(--color-border-strong)" opacity="0"/><circle class="hd" r="4.5" fill="var(--color-primary)" stroke="var(--color-surface)" stroke-width="2" opacity="0"/>';
 el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block;overflow:visible" preserveAspectRatio="none">'+g+'</svg><div class="tip"></div>';
 var sv=el.querySelector('svg'),tip=el.querySelector('.tip'),hv=el.querySelector('.hv'),hd=el.querySelector('.hd');
 el.onmousemove=function(e){var r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-P)/((W-P-8)/(n-1)))));
  hv.setAttribute('x1',X(i));hv.setAttribute('x2',X(i));hv.setAttribute('opacity',1);hd.setAttribute('cx',X(i));hd.setAttribute('cy',Y(S[0].d[i]));hd.setAttribute('opacity',1);
  tip.style.left=(X(i)/W*r.width)+'px';tip.style.top=(Y(S[0].d[i])/H*r.height)+'px';tip.style.opacity=1;tip.innerHTML=(o.label?o.label(i):'')+' · <b>'+S[0].d[i]+(o.unit||'')+'</b>';};
 el.onmouseleave=function(){tip.style.opacity=0;hv.setAttribute('opacity',0);hd.setAttribute('opacity',0);};}

document.getElementById('dm').innerHTML=dots(100,function(i){return i<95?'on" style="background:var(--color-border-strong)':i<99?'on':'p';},25);
var Q=[{g:'late',grp:'疑似违规',t:'「秋冬礼盒低价转让」',m:'晓风 · 笔记 · 举报 6',w:'0.91',late:1,au:'晓风',lv:'Lv2 · 注册 9 天',txt:'全新香薰礼盒，公司发的用不上，原价 ¥399 现 ¥99 包邮。<mark>加微 xf_9981 发图</mark>，<mark>私聊更便宜</mark>，量大可批发。',img:[0,1,0],h:'站外引流：正文有微信号，第 2 张图有二维码',hits:[['站外联系方式','规则 3.2',5],['图片二维码','规则 3.4',4],['近 7 天同类发布 5 次','账号行为',3]],btn:'驳回并限流 7 天',sec:'通过',cons:[['','5 分钟内可撤销'],['w','作者会收到通知，可申诉 3 天']]},
 {g:'late',grp:'疑似违规',t:'「这家店客服态度太差」',m:'林小满 · 评价 · 举报 3',w:'0.64',late:1,au:'林小满',lv:'Lv5 · 注册 2 年',txt:'等了 11 天退款都没处理，客服一直说在核实。<mark>这家店就是骗子</mark>，大家别买。',img:[0,0,0],h:'真实差评，只有一处人身攻击',hits:[['人身攻击 · “骗子”','规则 5.1',3],['订单真实 · 售后已超时','订单核验',1]],btn:'隐去 1 处后通过',sec:'原样通过',cons:[['','作者会看到被隐去的词']]},
 {g:'prog',grp:'需复核',t:'「双十一攻略合集」',m:'省钱研究所 · 外链 4 个',w:'0.32',au:'省钱研究所',lv:'Lv7',txt:'整理了 32 个品类的满减规则，附官方活动页链接。',img:[0,0,0],h:'外链都在白名单内',hits:[['外链 4 个 · 白名单域名','规则 3.1',1]],btn:'通过',cons:[['','可随时下架']]}];
function detail(q){return '<div class="card verdict"><div class="eyebrow">'+(q.late?'<span class="tag bad">疑似违规</span>':'<span class="tag prog">需复核</span>')+'<span>机审置信度 '+q.w+'</span></div><div class="display">'+q.h+'</div></div>'+
 '<div class="det" style="margin-top:14px"><div class="card"><div class="ch"><h3>原文</h3><span class="r muted" style="font-size:12.5px">命中处已标出</span></div><div class="post"><div class="au"><span class="av">'+q.au[0]+'</span><b>'+q.au+'</b>'+q.lv+' · 10-17 01:42</div><p>'+q.txt+'</p><div class="imgs">'+q.img.map(function(x,i){return '<div class="'+(x?'hit':'')+'">图 '+(i+1)+(x?' · 二维码':'')+'</div>';}).join('')+'</div></div></div>'+
 '<div class="card"><div class="ch"><h3>命中</h3></div><ul class="hits">'+q.hits.map(function(x){var c='';for(var j=1;j<=5;j++)c+='<i class="'+(j<=x[2]?'on':'')+'" style="height:'+(4+j*2)+'px"></i>';return '<li><span style="margin:0">'+x[0]+'<br><small class="muted mono">'+x[1]+'</small></span><span class="conf">'+c+'</span></li>';}).join('')+'</ul></div></div>';}

var cur=0,done={},lst=null;
function rl(){var h='',l='';Q.forEach(function(q,i){if(done[i])return;if(q.grp!==l){h+='<div class="grp">'+q.grp+'</div>';l=q.grp;}
 h+='<div class="it'+(i===cur?' on':'')+'" data-i="'+i+'">'+G(q.g)+'<span class="t">'+q.t+'</span><span class="w'+(q.late?' late':'')+'">'+q.w+'</span><span class="m">'+q.m+'</span></div>';});
 document.getElementById('list').innerHTML=h;document.querySelectorAll('#list .it').forEach(function(e){e.onclick=function(){cur=+e.dataset.i;R();};});}
function R(){rl();var F=document.getElementById('focus');F.innerHTML=detail(Q[cur]);F.classList.remove('enter');void F.offsetWidth;F.classList.add('enter');
 var A=document.getElementById('act');A.innerHTML=actbar(Q[cur]);var b=document.getElementById('go');if(b)b.onclick=ap;countUp(F);if(window.after)after();}
function actbar(q){return '<div class="cons">'+(q.cons||[]).map(function(c){return '<span><i class="'+c[0]+'"></i>'+c[1]+'</span>';}).join('')+'</div><div class="r"><button class="btn btn-g">稍后 <span class="k">L</span></button>'+(q.sec?'<button class="btn btn-s">'+q.sec+'</button>':'')+'<button class="btn btn-p" id="go">'+q.btn+' <span class="k">E</span></button></div>';}
function ap(){done[cur]=1;lst=cur;toast('已完成：'+Q[cur].btn+(Q[cur].btn?'':''));for(var i=0;i<Q.length;i++)if(!done[i]){cur=i;break;}R();}
function undo(){if(lst===null)return;delete done[lst];cur=lst;lst=null;document.getElementById('toast').classList.remove('show');R();}
document.addEventListener('keydown',function(e){if(e.target.closest('textarea,input'))return;var k=e.key;function st(d){var i=cur;do{i+=d;}while(i>=0&&i<Q.length&&done[i]);if(i>=0&&i<Q.length){cur=i;R();}}
 if(k==='j')st(1);if(k==='k')st(-1);if(k==='e')ap();if(k==='z')undo();});
R();
countUp();</script>
