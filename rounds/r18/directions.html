<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R18 定向 · 选一个方向 · 后台设计语言 v20.0</title>
<link rel="stylesheet" href="reference-tokens.css"><script src="themes.js"></script><script src="directions.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;line-height:22px;color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.top{height:56px;display:flex;align-items:center;gap:20px;padding:0 32px;background:var(--color-surface);border-bottom:1px solid var(--color-hairline);font-size:13px;color:var(--color-text-secondary);position:sticky;top:0;z-index:20}
.top b{color:var(--color-text);font-size:14px;font-weight:600}.top .r{margin-left:auto;display:flex;gap:20px}.top a:hover{color:var(--color-text)}
.wrap{max-width:1440px;margin:0 auto;padding:32px 32px 80px}
h1{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.015em}
.lead{font-size:15px;line-height:24px;color:var(--color-text-secondary);margin-top:8px;max-width:820px}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
.dir{text-align:left;background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:12px;padding:0;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.dir:hover{border-color:var(--color-border-strong)}
.dir.on{border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary)}
.dir .sw{height:72px;display:grid;grid-template-columns:28% 1fr;gap:0;border-bottom:1px solid var(--color-hairline)}
.dir .tx{padding:12px 14px}.dir .tx b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}.dir .tx b em{font-style:normal;font-size:12px;font-weight:500;color:var(--color-text-tertiary)}
.dir .tx p{font-size:13px;line-height:20px;color:var(--color-text-secondary);margin-top:4px}
.dir .cur{display:none;margin-left:auto;font-size:12px;font-weight:500;color:var(--color-primary-text)}.dir.on .cur{display:inline}
.main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.panel{background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:12px;padding:20px;position:sticky;top:76px}
.panel h2{font-size:20px;line-height:28px;font-weight:600}.panel .who{font-size:13px;color:var(--color-text-tertiary);margin-top:2px}
.panel ul{margin-top:16px;display:flex;flex-direction:column;gap:10px}.panel li{list-style:none;font-size:13.5px;line-height:21px;color:var(--color-text-secondary);padding-left:14px;position:relative}
.panel li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--color-primary)}
.panel li b{color:var(--color-text);font-weight:500}
.panel .fit{margin-top:16px;padding-top:16px;border-top:1px solid var(--color-hairline);font-size:13px;color:var(--color-text-secondary)}.panel .fit b{display:block;color:var(--color-text);font-weight:500;margin-bottom:2px}
.pick{margin-top:20px;width:100%;height:40px;border-radius:8px;border:0;background:var(--color-primary);color:var(--color-on-primary);font-weight:500;font-size:14px;cursor:pointer}.pick:hover{background:var(--color-primary-hover)}
.panel .hint{font-size:12px;color:var(--color-text-tertiary);margin-top:8px;text-align:center}
.pv{background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:12px;overflow:hidden}
.pvh{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--color-hairline)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--color-surface-subtle);border:1px solid var(--color-hairline)}
.seg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:13px;color:var(--color-text-secondary)}
.seg button.on{background:var(--color-surface);color:var(--color-text);font-weight:500;box-shadow:0 0 0 1px var(--color-hairline)}
.pvh .r{margin-left:auto;display:flex;gap:12px;font-size:13px;color:var(--color-text-tertiary)}.pvh .r a:hover{color:var(--color-text)}
.stage{position:relative;overflow:hidden;background:var(--color-bg)}
.stage iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}
.cmp{margin-top:40px}.cmp h2{font-size:20px;font-weight:600}.cmp table{width:100%;border-collapse:collapse;margin-top:12px;background:var(--color-surface);border:1px solid var(--color-hairline);border-radius:12px;overflow:hidden;font-size:13px}
.cmp th{text-align:left;height:40px;padding:0 14px;font-weight:500;font-size:12px;color:var(--color-text-tertiary);background:var(--color-surface-subtle);border-bottom:1px solid var(--color-hairline)}.cmp td{padding:10px 14px;border-bottom:1px solid var(--color-divider);vertical-align:top;color:var(--color-text-secondary)}.cmp td:first-child{color:var(--color-text);font-weight:500;white-space:nowrap}
.cmp tr:last-child td{border-bottom:0}.cmp td.on{background:var(--color-surface-selected)}
</style></head>
<body>
<nav class="top"><b>定向 · 选一个方向</b><a href="#pv">预览</a><a href="#cmp">对比表</a><a href="spec.html">共同规则</a><span class="r"><a href="../../">全部轮次</a></span></nav>
<div class="wrap">
<h1>四个方向，同一份内容。选一个，下一轮按它写成完整规范。</h1>
<p class="lead">R14 起连续几轮都是 5 分，继续闭着眼迭代没有意义。这一轮把“长什么样”交给你选：四个方向都用鸢尾主色、Geist 数字、只用无衬线，内容完全相同（订单售后、数据看板、内容审核），差别只在<b>密度、层次、明暗和装饰</b>。点上面的卡片切换，下面是可以操作的真实页面；看中了就点「选这个方向」，然后在右下角打分提交。</p>
<div class="dirs" id="dirs"></div>
<div class="main" id="pv">
<aside class="panel" id="panel"></aside>
<section class="pv"><div class="pvh"><div class="seg" id="pages"><button data-p="demo-orders.html" class="on">订单售后 · 表格</button><button data-p="demo-analytics.html">数据看板</button><button data-p="demo-content.html">内容审核 · 详情</button></div><span class="r"><a id="open" href="#" target="_blank">新窗口打开 ↗</a></span></div><div class="stage" id="stage"><iframe id="fr" title="方向预览"></iframe></div></section>
</div>
<section class="cmp" id="cmp"><h2>四个方向的差别</h2><table id="ct"></table></section>
</div>
<script>
var D={
 a:{name:'精简',en:'Linear 式',line:'白底、发丝线、小字号，界面几乎全是黑白灰，鸢尾只出现在按钮和选中处。',sw:['#FAFAFB','#FFFFFF','#E9E9EE'],
  pr:['<b>没有卡片</b>：区块只用 1px 发丝线分隔，页面就是一张纸','<b>字号小、行高紧</b>：正文 13，表格行 36，一屏多看 30% 内容','<b>单色界面</b>：状态只用小圆点 + 文字，红色只给异常，鸢尾只给操作','<b>控件 28px</b>，圆角 6，几乎没有投影'],fit:'天天用、追求速度的内部工具；用户熟练，讨厌装饰。'},
 b:{name:'卡片',en:'柔和 SaaS',line:'淡紫画布上的大圆角白卡，柔和投影，留白宽松，按钮和标签都更圆、更友好。',sw:['#F4F2FB','#FFFFFF','#E4DEFA'],
  pr:['<b>画布带一点鸢尾色</b>，白卡圆角 18，靠柔和投影浮起','<b>宽松</b>：卡内边距 24，表格行 56，区块间距 20','<b>胶囊形</b>页签、标签和按钮，主按钮带一点主色光晕','<b>侧栏融入画布</b>，当前项是一张小白卡'],fit:'面向商家 / 客户的 SaaS 后台；使用频率中等，要显得友好、好上手。'},
 c:{name:'深色工作台',en:'深色专业工具',line:'近黑底色上的鸢尾，卡片是极淡的玻璃层，图表和进度条带一点光。',sw:['#09090C','#15151B','#7B66FF'],
  pr:['<b>深色优先</b>：底色近黑，卡片用 3% 白的渐变层 + 发丝边','<b>数据有光</b>：主序列、进度条、选中项带鸢尾辉光，异常带红色辉光','<b>文字三级灰</b>，对比度仍满足阅读','<b>主按钮发光</b>，其余控件是半透明层'],fit:'运维、监控、数据分析这类长时间盯屏的场景；夜间值班。'},
 d:{name:'信息密集',en:'企业级 · AntD Pro / Stripe 式',line:'深色侧栏、灰底、方角卡片、带竖线的紧凑表格，一屏放下最多的信息。',sw:['#1A1823','#F0F1F4','#FFFFFF'],
  pr:['<b>强网格</b>：方角 4px、灰底白卡、卡头浅灰条，结构一眼可见','<b>紧凑表格</b>：行高 34，带列竖线和斑马纹，字号 12.5','<b>深色侧栏</b>，当前项鸢尾实底','<b>描边标签</b>，KPI 卡把迷你图放在数字旁边'],fit:'字段多、要批量比对的企业后台（财务、供应链、ERP）。'}};
var cur=UIDLDirection.cur(),page='demo-orders.html',fr=document.getElementById('fr');
function sw(c){return '<div class="sw"><i style="background:'+c[0]+'"></i><span style="background:'+c[1]+';display:flex;align-items:center;padding:0 12px;gap:6px"><i style="display:block;width:44%;height:8px;border-radius:4px;background:'+c[2]+'"></i><i style="display:block;width:18%;height:8px;border-radius:4px;background:#6246EA"></i></span></div>';}
document.getElementById('dirs').innerHTML=Object.keys(D).map(function(k){var d=D[k];return '<button class="dir" data-d="'+k+'">'+sw(d.sw)+'<div class="tx"><b>'+k.toUpperCase()+' · '+d.name+'<em>'+d.en+'</em><span class="cur">当前</span></b><p>'+d.line+'</p></div></button>';}).join('');
document.getElementById('ct').innerHTML='<tr><th></th>'+Object.keys(D).map(function(k){return '<th>'+k.toUpperCase()+' · '+D[k].name+'</th>';}).join('')+'</tr>'+
 [['底色','白','淡紫画布','近黑','浅灰'],['容器','无卡片，发丝线','圆角 18 白卡 + 柔和投影','玻璃层卡片 + 发丝边','方角 4 白卡 + 灰卡头'],['正文 / 表格行','13 / 36','14 / 56','14 / 48','12.5 / 34'],['控件高 / 圆角','28 / 6','38 / 12','32 / 8','28 / 4'],['状态','圆点 + 文字，无底色','胶囊浅底','浅底 + 辉光','描边方标签'],['侧栏','浅灰','融入画布','近黑半透明','深色，当前项实底'],['适合','熟练用户的内部工具','客户 / 商家 SaaS','监控、分析、夜间值班','字段多的企业系统']].map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i&&'abcd'[i-1]===cur?' class="on"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('');
function render(){document.querySelectorAll('.dir').forEach(function(b){b.classList.toggle('on',b.dataset.d===cur);});var d=D[cur];
 document.getElementById('panel').innerHTML='<div class="who">方向 '+cur.toUpperCase()+' · '+d.en+'</div><h2>'+d.name+'</h2><ul>'+d.pr.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul><div class="fit"><b>适合</b>'+d.fit+'</div><button class="pick" id="pick">选这个方向</button><p class="hint">会在右下角反馈框里写好“[选定方向: '+cur+'] '+d.name+'”，打分后提交</p>';
 document.getElementById('pick').onclick=adopt;
 var src=page+'?direction='+cur;if(fr.getAttribute('src')!==src)fr.setAttribute('src',src);document.getElementById('open').href=src;
 document.querySelectorAll('#ct td').forEach(function(td){var i=td.cellIndex;td.classList.toggle('on',i>0&&'abcd'[i-1]===cur);});}
function adopt(){var d=D[cur];var p=document.querySelector('.uifb');if(p&&p.classList.contains('uifb-collapsed')){p.classList.remove('uifb-collapsed');try{localStorage.setItem('uifb-open','1');}catch(e){}}
 setTimeout(function(){var ta=document.querySelector('.uifb textarea');if(ta){var rest=ta.value.replace(/^\[选定方向: [^\]]*\][^\n]*\n?/,'');ta.value='[选定方向: '+cur+'] '+d.name+(rest?'\n'+rest:'');ta.focus();}},60);}
document.querySelectorAll('.dir').forEach(function(b){b.onclick=function(){cur=b.dataset.d;UIDLDirection.set(cur);render();};});
document.querySelectorAll('#pages button').forEach(function(b){b.onclick=function(){page=b.dataset.p;document.querySelectorAll('#pages button').forEach(function(x){x.classList.toggle('on',x===b);});render();};});
function fit(){var st=document.getElementById('stage'),w=st.clientWidth,s=w/1440;fr.style.transform='scale('+s+')';st.style.height=(900*s)+'px';}
addEventListener('resize',fit);render();fit();
</script>
<link rel="stylesheet" href="../../assets/feedback.css"><script src="../../assets/feedback-config.js" defer></script><script src="../../assets/feedback.js" data-round="r18" defer></script>
</body></html>
